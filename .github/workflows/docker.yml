name: Docker

on:
  push:
    branches: [master]
    tags: ["v*", "nightly/v*", "beta/v*"]
  pull_request:
    branches: [release/tog.5-build-preparation]
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build artifacts only; registry publication is not supported
        type: choice
        options: [build-only]
        default: build-only
        required: true
      source_sha:
        description: Full immutable application source commit (40 hex characters)
        type: string
        required: true
      expected_source_sha:
        description: Independently approved source SHA; must equal source_sha
        type: string
        required: true

# This release line has no package write, login, cache, cloud or promotion path.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout build controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.workflow_sha }}
          persist-credentials: false
      - name: Verify build-only contract
        run: |
          python3 -m venv "$RUNNER_TEMP/guards"
          "$RUNNER_TEMP/guards/bin/pip" install --no-cache-dir PyYAML==6.0.3
          "$RUNNER_TEMP/guards/bin/python" -m unittest discover -s scripts/ci -p 'test_immutable_docker.py' -v
      - name: Validate workflow expressions and YAML
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/docker.yml

  resolve:
    if: github.event_name != 'pull_request'
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      workflow_sha: ${{ steps.source.outputs.workflow_sha }}
      image: ${{ steps.source.outputs.image }}
    steps:
      - name: Checkout build controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate immutable inputs before source checkout
        id: source
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 scripts/ci/immutable-docker.py resolve

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout build controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.workflow_sha }}
          path: controls
          persist-credentials: false
      - name: Checkout exact application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout, baseline and frozen inputs
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: python3 controls/scripts/ci/immutable-docker.py prepare

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build production archives without publishing
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          tags: ${{ needs.resolve.outputs.image }}:sha-${{ needs.resolve.outputs.source_sha }}
          build-args: |
            PAPERCLIP_BUILD_VERSION=sha-${{ needs.resolve.outputs.source_sha }}
            PAPERCLIP_BUILD_COMMIT=${{ needs.resolve.outputs.source_sha }}
            CLI_TOOLS_CACHE_EPOCH=${{ needs.resolve.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.source_sha }}
            io.github.togetherweown.workflow-sha=${{ needs.resolve.outputs.workflow_sha }}
          outputs: |
            type=oci,dest=${{ runner.temp }}/production-${{ matrix.arch }}.oci.tar
            type=docker,dest=${{ runner.temp }}/production-${{ matrix.arch }}.docker.tar

      # Both exports come from the same solve. Verify the loaded config against
      # the OCI archive before testing the real entrypoint on each native runner.
      - name: Load locally and retain orphan-reaping verification
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/production-$ARCH.docker.tar"
          docker image inspect "$IMAGE:sha-$SOURCE_SHA" > "$RUNNER_TEMP/runtime-image.json"
          python3 controls/scripts/ci/immutable-docker.py verify-runtime
          docker run --rm -i --pull never --network none "$IMAGE:sha-$SOURCE_SHA" sh -s < controls/scripts/assert-orphan-reaping.sh

      - name: Record verified OCI output and provenance
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: python3 controls/scripts/ci/immutable-docker.py record
      - name: Upload run-scoped production artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-oci-${{ matrix.arch }}-${{ needs.resolve.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-${{ matrix.arch }}.oci.tar
            ${{ runner.temp }}/production-${{ matrix.arch }}.oci.tar.sha256
            ${{ runner.temp }}/production-${{ matrix.arch }}.provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  complete:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm both native artifacts completed
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          printf 'Production-only build completed for amd64 and arm64.\nSource: %s\nWorkflow: %s\nNo registry manifest was published.\n' "$SOURCE_SHA" "$WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
