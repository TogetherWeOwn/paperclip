name: Affected workflow scope

on:
  workflow_call:
    inputs:
      scope:
        required: true
        type: string
    outputs:
      affected:
        value: ${{ jobs.changes.outputs.affected }}

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Select affected work (full on master, nightly, and explicit calls)
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_SCOPE: ${{ inputs.scope }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-affected-work.mjs
