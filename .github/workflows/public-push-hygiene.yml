name: Public push hygiene
run-name: Public push hygiene ${{ github.sha }}

# Branch-push coverage for CONTRIBUTING.md "No Internal Issue References".
# PR workflows never see branch-only pushes, so this runs on every branch push
# and scans the new publication population: commit messages plus added lines
# of commits reachable from the pushed head but from no public line (origin
# master, origin deploy/tog6, upstream paperclipai/paperclip master). Feature
# branches are never public lines, so a flagged commit stays flagged on every
# branch that carries it. History is never rewritten. Pushes to master and
# deploy/tog6 are ignored like master: each merge there would otherwise flag
# the line's whole already-public divergence with no recourse, and merges land
# reviewed. Direct pushes to master stay disabled by branch protection;
# making this check required is a repo-admin step owned by the Operator route.
on:
  push:
    branches-ignore: [master, deploy/tog6]

permissions: {}

concurrency:
  group: public-push-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream master as a public line
        run: |
          # Credential-free: public upstream snapshot for fix/* branches cut
          # from paperclipai/paperclip. If this fetch fails, the scanner exits
          # 2 on the missing public line rather than scanning upstream history.
          git fetch --no-tags https://github.com/paperclipai/paperclip.git master:refs/remotes/upstream/master
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Scan pushed messages and added lines for internal tracker ids
        env:
          PUSH_HEAD: ${{ github.sha }}
          PUSH_SELF_REF: refs/remotes/origin/${{ github.ref_name }}
        run: |
          # The scanner excludes only public lines (origin master, deploy/tog6,
          # upstream master), minus this branch's own ref. A clean follow-up
          # push cannot hide an earlier dirty commit, and merging a public line
          # flags no line-owned commits. github.event.before dangles after
          # amend/force-push, so it is not used.
          node scripts/check-public-push-hygiene.mjs --self-ref "$PUSH_SELF_REF" --head "$PUSH_HEAD"
