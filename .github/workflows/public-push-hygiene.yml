name: Public push hygiene
run-name: Public push hygiene ${{ github.sha }}

# Branch-push coverage for CONTRIBUTING.md "No Internal Issue References".
# PR workflows never see branch-only pushes, so this runs on every branch push
# and scans the new publication population: commit messages plus added tracked
# lines of commits not already reachable from another origin ref. Master is
# excluded: merges land there already reviewed, and a post-merge flag would have no recourse
# (history is never rewritten). This assumes direct-to-master pushes stay
# disabled by branch protection; making this check required is a repo-admin
# step owned by the Operator route.
on:
  push:
    branches-ignore: [master]

permissions: {}

concurrency:
  group: public-push-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Scan pushed messages and added lines for internal tracker ids
        env:
          PUSH_HEAD: ${{ github.sha }}
          PUSH_SELF_REF: refs/remotes/origin/${{ github.ref_name }}
        run: |
          # The scanner picks the base from shared history with every other
          # origin ref, so branches cut from deploy/* or port/* scan only their
          # own commits. The branch's own unshared history stays in scope on
          # every push:
          # - merging master flags no master-owned commits/lines,
          # - a clean follow-up push cannot hide an earlier dirty commit,
          # - github.event.before dangles after amend/force-push, so it is not used.
          # Exits 2 (refuses to pass) when no shared history can scope the range.
          node scripts/check-public-push-hygiene.mjs --self-ref "$PUSH_SELF_REF" --head "$PUSH_HEAD"
