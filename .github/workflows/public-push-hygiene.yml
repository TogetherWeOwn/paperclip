name: Public push hygiene
run-name: Public push hygiene ${{ github.sha }}

# Branch-push coverage for CONTRIBUTING.md "No Internal Issue References".
# PR workflows never see branch-only pushes, so this runs on every branch push
# and scans exactly the pushed delta: new commit messages plus added tracked
# lines. Master is excluded: merges land there already reviewed, and a
# post-merge flag would have no recourse (history is never rewritten). This
# assumes direct-to-master pushes stay disabled by branch protection; making
# this check required is a repo-admin step owned by the Operator route.
on:
  push:
    branches-ignore: [master]

permissions: {}

concurrency:
  group: public-push-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Scan pushed messages and added lines for internal tracker ids
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          # PUSH_BEFORE is the previous head, but after a force-push/amend it is
          # dangling (not on any ref) so a full fetch never brings it locally.
          # Reusing it would fail closed on every amended push. Prefer it only
          # when it resolves locally AND is an ancestor; otherwise fall back to
          # merge-base, which scans a superset (whole branch delta) and stays
          # fail-closed without false reds on rewritten history.
          BASE=""
          if [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$PUSH_BEFORE" "$PUSH_HEAD" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          else
            echo "PUSH_BEFORE is new, missing, or not an ancestor (rewritten history); scanning from merge-base with origin/master." >&2
          fi
          if [ -z "$BASE" ]; then
            BASE="$(git merge-base origin/master "$PUSH_HEAD")" \
              || { echo "ERROR: could not resolve merge-base with origin/master; refusing to pass." >&2; exit 2; }
          fi
          [ -n "$BASE" ] || { echo "ERROR: could not resolve scan base; refusing to pass." >&2; exit 2; }
          node scripts/check-public-push-hygiene.mjs --base "$BASE" --head "$PUSH_HEAD"
