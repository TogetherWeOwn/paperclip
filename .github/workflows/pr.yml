name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Execute the reviewed reusable workflow from its immutable published SHA;
    # never trust a workflow implementation from the pull request checkout.
    uses: TogetherWeOwn/paperclip/.github/workflows/pr-trusted.yml@3f1772f2cfe60baf37fc8665375ba7953cf277f7
