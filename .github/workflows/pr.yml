name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Replace with the published remediation commit after its local squash
    # fixture, merge-tree, and focused tests pass. A reusable workflow cannot
    # safely execute an unpublished revision from the pull request checkout.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@TRUSTED_WORKFLOW_REVISION
