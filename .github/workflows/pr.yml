name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Execute the reviewed reusable workflow from its immutable published SHA;
    # never trust a workflow implementation from the pull request checkout.
    uses: TogetherWeOwn/paperclip/.github/workflows/pr-trusted.yml@d56d295320c2d8f885225226d06a6703c60c6a3f
    secrets:
      TRUSTED_POLICY_TOKEN: ${{ secrets.TRUSTED_POLICY_TOKEN }}
