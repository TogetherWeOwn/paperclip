id: gha-branch-name-trust
language: Yaml
severity: warning
message: 'A release/lockfile exemption must not trust a spoofable PR branch name alone.'
rule:
  kind: block_mapping_pair
  all:
  - regex: (?s)if:.*github\.head_ref.*(?:release-please|lockfile|refresh)
  - not:
      regex: github\.actor|head\.repo
files:
- .github/workflows/*.yml
- .github/workflows/*.yaml
