id: py-oswalk-onerror
language: Python
severity: warning
message: 'A fail-closed tree scan must surface os.walk permission errors Example: paperclip-ops-tooling#877.'
rule:
  all:
  - pattern: os.walk($$$ARGS)
  - not:
      has:
        kind: argument_list
        has:
          kind: keyword_argument
          regex: ^onerror\s*=
