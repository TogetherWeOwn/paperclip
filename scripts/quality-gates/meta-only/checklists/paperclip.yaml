- id: paperclip.test-case-variants
  question: Does the test input set include the case, quoting, or formatting variant that the changed parser contract
    says it accepts?
  pass_answer: 'yes'
  when:
    file_globs:
    - server/src/services/*
    diff_patterns:
    - parser or regex changes
    - case-insensitive matching
    - formatted source scan
    selection: Apply when a changed hunk instantiates this specific concern; do not ask about absent features.
  evidence_required:
    quote: Quote the accepted grammar or case-insensitivity contract, the parser branch, and one test input using
      the variant. Do not infer semantic equivalence from a regex alone.
    format: 'For each quotation: repository-relative path, reviewed head SHA, line range, exact excerpt.'
    context: One diff hunk plus the named files/functions in the example. Ask for the missing excerpt; never guess.
    missing_or_ambiguous: fail_unknown
