schema_version: 1
stack: paperclip
technology: TypeScript server and adapters
protocol:
  one_question_per_request: true
  answer_schema:
    answer: yes|no|unknown
    evidence:
    - file: path
      head_sha: sha
      lines: start-end
      quote: exact source text
  acceptance: Only pass_answer with all requested excerpts. Unknown, missing context, or unquoted assertions fail.
    No model answer alone authorizes merge.
  context_limit: Include the changed function and the named caller/callee/test excerpt. If the answer needs whole-system
    reasoning, classify residual judgment.
questions:
- id: paperclip.test-production-call
  question: Does the cited test execute the changed production entry point rather than a replacement implementation
    or stub of that entry point?
  pass_answer: 'yes'
  when:
    file_globs:
    - packages/adapter-utils/src/*
    - server/src/__tests__/*
    - server/src/routes/*
    - server/src/services/*
    - server/src/services/recovery/*
    diff_patterns:
    - new or changed test
    - mock, stub, fixture, spy, assertion
    selection: Apply when a changed hunk instantiates this specific concern; do not ask about absent features.
  evidence_required:
    quote: Quote the production entry-point declaration, the test call site, and every mock replacing that entry
      point. A source-string match or copied algorithm is not execution.
    format: 'For each quotation: repository-relative path, reviewed head SHA, line range, exact excerpt.'
    context: One diff hunk plus the named files/functions in the example. Ask for the missing excerpt; never guess.
    missing_or_ambiguous: fail_unknown
  calibration_status: not calibrated on Muse/Gemini; applicability mapping only
  mapping_uncertain: false
